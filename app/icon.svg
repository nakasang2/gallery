<svg viewBox="0 0 170 170" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* The mark is a single tone, so a dark tab strip would swallow a black mark. Firefox
       resolves this query for an SVG favicon; Chrome/Edge render the SVG but do not
       currently resolve prefers-color-scheme in that context (favicon.ico is the
       fallback there, and being ICO it cannot carry a dark variant of its own either —
       accepted, not solved, same limitation noted when this mark was first built). */
    .bar { fill: #0B0A09; }
    @media (prefers-color-scheme: dark) { .bar { fill: #ECE7DE; } }
  </style>
