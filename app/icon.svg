<svg viewBox="-24 -24 448 448" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* The mark is pure black, so a dark tab strip would swallow it. This rule is the only
       lever available, and it does NOT cover every browser: a favicon is rasterised with no
       embedding document, so there is no scheme for the query to match unless the browser
       supplies one. Firefox does; Chrome and Edge render this SVG but leave the mark black,
       and favicon.ico cannot rescue them because ICO holds no dark variant and they are not
       reading it anyway. Accepted rather than solved — the alternative is baking an opaque
       tile behind the mark, which changes the brand mark itself. Revisit if Chromium ships
       favicon colour-scheme support. (favicon.ico stays regardless: SVG-blind clients need
       it, and crawlers, feed readers and Windows pinned sites request it by convention.) */
    #mark { fill: #000000; }
    @media (prefers-color-scheme: dark) { #mark { fill: #FFFFFF; } }
  </style>
